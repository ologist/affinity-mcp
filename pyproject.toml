[project]
name = "affinity-mcp"
version = "0.1.0"
description = "Affinity CRM MCP Server"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3.4",
    "httpx>=0.28.1",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = ["pip-audit>=2.7.0"]

[project.scripts]
affinity-mcp = "affinity_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/affinity_mcp"]

[tool.ruff.lint]
select = ["C4", "E", "F", "I", "PERF", "UP"]
ignore = ["PERF203", "E501"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
]
